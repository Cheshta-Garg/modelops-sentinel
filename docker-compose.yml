version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 - Durable State & Metadata
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: modelops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modelops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modelops_password}
      POSTGRES_DB: ${POSTGRES_DB:-modelops_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modelops_user} -d ${POSTGRES_DB:-modelops_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - modelops-network

  # ----------------------------------------------------------------------------
  # Redis 7 - Cache, Task Broker & Telemetry Buffer
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: modelops-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - modelops-network

  # ----------------------------------------------------------------------------
  # FastAPI API Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modelops-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    networks:
      - modelops-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  modelops-network:
    driver: bridge
